<html lang="en">

<title>Sky Hopper — Endless Runner (Cocos Creator Port Architecture)</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{
    background:radial-gradient(120% 100% at 50% 0%, #18224d 0%, #0b1026 60%, #070a18 100%);
    font-family:'Trebuchet MS','Segoe UI',system-ui,-apple-system,sans-serif;
    overflow:hidden;user-select:none;-webkit-user-select:none;touch-action:none;overscroll-behavior:none;
  }
  #app{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;}
  #stage{
    position:relative;
    width:min(100vw, calc(100vh * 9 / 16));
    height:min(100vh, calc(100vw * 16 / 9));
    overflow:hidden;background:#3f9df7;
    box-shadow:0 0 60px rgba(0,0,0,.55);
    --s:1;touch-action:none;
  }
  @media (min-width:640px) and (min-height:640px){#stage{border-radius:18px;}}
  #cv{position:absolute;inset:0;width:100%;height:100%;display:block;}
  .hidden{display:none !important;}
  .spacer{flex:1;min-height:calc(8px*var(--s));}

  /* ===== HUD (Cocos: GameUI.ts) ===== */
  #hud{position:absolute;inset:0;pointer-events:none;z-index:5;}
  .hud-row{position:absolute;top:calc(12px*var(--s));left:calc(12px*var(--s));right:calc(12px*var(--s));display:flex;justify-content:space-between;align-items:flex-start;}
  .hud-left,.hud-right{display:flex;gap:calc(8px*var(--s));align-items:center;}
  .pill{display:flex;align-items:center;gap:calc(6px*var(--s));background:rgba(8,12,36,.45);color:#fff;font-weight:800;font-size:calc(20px*var(--s));padding:calc(6px*var(--s)) calc(12px*var(--s));border-radius:999px;backdrop-filter:blur(3px);letter-spacing:.5px;}
  .pill svg{width:calc(20px*var(--s));height:calc(20px*var(--s));}
  .pill.pop{animation:pop .25s ease;}
  @keyframes pop{0%{transform:scale(1);}40%{transform:scale(1.18);}100%{transform:scale(1);}}
  .icon-btn{pointer-events:auto;width:calc(40px*var(--s));height:calc(40px*var(--s));border:none;border-radius:50%;background:rgba(8,12,36,.45);color:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer;backdrop-filter:blur(3px);}
  .icon-btn:active{transform:scale(.92);}
  .icon-btn svg{width:56%;height:56%;}
  .ic-off{display:none;}
  .muted .ic-on{display:none;}
  .muted .ic-off{display:block;}

  /* ===== Overlays (Cocos: MainMenuUI / PauseUI / GameOverUI) ===== */
  .overlay{position:absolute;inset:0;z-index:10;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:calc(14px*var(--s));background:rgba(8,12,34,.55);backdrop-filter:blur(7px);-webkit-backdrop-filter:blur(7px);opacity:0;visibility:hidden;transition:opacity .28s ease,visibility .28s;text-align:center;padding:calc(24px*var(--s));}
  .overlay.visible{opacity:1;visibility:visible;}
  #menu{justify-content:flex-start;padding-top:calc(100px*var(--s));}
  .game-title{font-size:calc(58px*var(--s));font-weight:900;letter-spacing:calc(2px*var(--s));color:#fff;line-height:1;text-shadow:0 calc(4px*var(--s)) 0 rgba(0,0,0,.18);}
  .game-title span{display:block;background:linear-gradient(180deg,#ffe259,#ff7a1a);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 calc(4px*var(--s)) 0 rgba(0,0,0,.25));animation:float 2.4s ease-in-out infinite;}
  @keyframes float{0%,100%{transform:translateY(0);}50%{transform:translateY(calc(-6px*var(--s)));}}
  .subtitle{color:#d8ecff;font-weight:700;letter-spacing:calc(5px*var(--s));font-size:calc(13px*var(--s));margin-top:calc(8px*var(--s));text-transform:uppercase;}
  .big-btn{pointer-events:auto;font-family:inherit;font-weight:900;font-size:calc(24px*var(--s));letter-spacing:1px;color:#fff;background:linear-gradient(180deg,#ffb300,#ff6a00);border:none;border-radius:calc(16px*var(--s));padding:calc(15px*var(--s)) calc(56px*var(--s));cursor:pointer;box-shadow:0 calc(8px*var(--s)) 0 #c24e00,0 calc(14px*var(--s)) 24px rgba(0,0,0,.35);transition:transform .08s,box-shadow .08s;min-width:calc(230px*var(--s));}
  .big-btn:active{transform:translateY(calc(6px*var(--s)));box-shadow:0 calc(2px*var(--s)) 0 #c24e00,0 calc(6px*var(--s)) 12px rgba(0,0,0,.3);}
  .mid-btn{pointer-events:auto;font-family:inherit;font-weight:800;font-size:calc(14px*var(--s));letter-spacing:1px;color:#eaf3ff;background:rgba(255,255,255,.14);border:calc(2px*var(--s)) solid rgba(255,255,255,.35);border-radius:calc(12px*var(--s));padding:calc(10px*var(--s)) calc(22px*var(--s));cursor:pointer;min-width:calc(200px*var(--s));transition:transform .08s,background .15s;}
  .mid-btn:active{transform:scale(.95);background:rgba(255,255,255,.25);}
  .row{display:flex;gap:calc(12px*var(--s));justify-content:center;}
  .chip-row{display:flex;gap:calc(10px*var(--s));}
  .chip{display:flex;align-items:center;gap:calc(6px*var(--s));background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.25);color:#fff;font-weight:800;font-size:calc(14px*var(--s));padding:calc(6px*var(--s)) calc(12px*var(--s));border-radius:999px;}
  .chip b{color:#ffe259;}
  .chip svg{width:calc(16px*var(--s));height:calc(16px*var(--s));}
  .corner-btn{position:absolute;top:calc(12px*var(--s));right:calc(12px*var(--s));z-index:12;}
  .panel-title{font-size:calc(34px*var(--s));font-weight:900;color:#fff;letter-spacing:2px;text-shadow:0 3px 0 rgba(0,0,0,.25);}
  .final-score{font-size:calc(84px*var(--s));font-weight:900;color:#ffe259;line-height:1;text-shadow:0 calc(5px*var(--s)) 0 rgba(0,0,0,.25);}
  .final-sub{color:#dbe9ff;font-weight:700;font-size:calc(15px*var(--s));letter-spacing:1px;}
  .final-sub b{color:#fff;}
  .record{background:linear-gradient(90deg,#ffd54a,#ff9d00);color:#5a2d00;font-weight:900;font-size:calc(15px*var(--s));letter-spacing:2px;padding:calc(6px*var(--s)) calc(16px*var(--s));border-radius:999px;animation:pulse 1s ease-in-out infinite;box-shadow:0 0 24px rgba(255,190,0,.6);}
  @keyframes pulse{0%,100%{transform:scale(1);}50%{transform:scale(1.09);}}
  .ad-note{color:#9db6e4;font-size:calc(11px*var(--s));letter-spacing:1px;}

  #hint{position:absolute;left:50%;top:58%;transform:translate(-50%,-50%);z-index:6;background:rgba(8,12,36,.6);color:#fff;font-weight:800;font-size:calc(15px*var(--s));letter-spacing:1px;padding:calc(10px*var(--s)) calc(18px*var(--s));border-radius:999px;white-space:nowrap;pointer-events:none;opacity:0;transition:opacity .3s;}
  #hint.show{opacity:1;}
  #toast{position:absolute;left:50%;bottom:calc(46px*var(--s));transform:translate(-50%,20px);z-index:30;background:rgba(10,16,44,.88);color:#fff;font-weight:700;font-size:calc(14px*var(--s));padding:calc(10px*var(--s)) calc(18px*var(--s));border-radius:999px;opacity:0;transition:all .3s ease;pointer-events:none;white-space:nowrap;border:1px solid rgba(255,255,255,.2);}
  #toast.show{opacity:1;transform:translate(-50%,0);}

  .leaders{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%) scale(.96);width:82%;background:rgba(10,15,40,.94);border:1px solid rgba(255,255,255,.18);border-radius:calc(16px*var(--s));padding:calc(18px*var(--s));opacity:0;visibility:hidden;transition:all .22s ease;z-index:15;}
  .leaders.open{opacity:1;visibility:visible;transform:translate(-50%,-50%) scale(1);}
  .leaders h3{color:#fff;font-size:calc(15px*var(--s));letter-spacing:2px;margin-bottom:calc(8px*var(--s));text-align:left;}
  .leaders h3 span{opacity:.5;}
  .leaders ol{list-style:none;}
  .leaders li{display:flex;justify-content:space-between;color:#cfe0ff;font-weight:700;font-size:calc(14px*var(--s));padding:calc(6px*var(--s)) calc(8px*var(--s));border-radius:8px;}
  .leaders li.me{background:rgba(255,180,0,.18);color:#ffe259;}
  .leaders li:nth-child(-n+3):not(.me){color:#ffd54a;}
  .leaders-close{margin-top:calc(10px*var(--s));width:100%;}

<script>
(()=>{ 'use strict';
/* =====================================================================================
   SKY HOPPER - Endless Runner
   HTML reference implementation carrying the Cocos Creator + TypeScript port
   architecture: GameManager / PlayerController / ObstacleManager / CoinManager /
   ScoreManager / DifficultyManager / SaveManager / AudioManager / InputManager /
   PlatformAdapter (Local + TikTok TODO) / EventBus / UI (menu, HUD, game over).
   ===================================================================================== */
const W=540,H=960,GROUND=H-150;            // design resolution 9:16 (Cocos: config/Config.ts)
const GRAV=2600,JUMP_V=985,MAX_FALL=1500,COYOTE=0.10,JUMP_BUF=0.12,TAU=Math.PI*2;
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const lerp=(a,b,t)=>a+(b-a)*t;
const rand=(a,b)=>a+Math.random()*(b-a);
const randi=(a,b)=>Math.floor(rand(a,b+1));
function rr(ctx,x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}

/* ======================= scripts/save/SaveManager.ts ======================= */
class SaveManager{
  constructor(){this.key='skyhopper.save.v1';this.data={highScore:0,totalCoins:0,muted:false,runs:0};this.load();}
  load(){try{const r=localStorage.getItem(this.key);if(r){const o=JSON.parse(r);for(const k in this.data)if(k in o)this.data[k]=o[k];}}catch(e){}}
  persist(){try{localStorage.setItem(this.key,JSON.stringify(this.data));}catch(e){}}
  saveGame(obj){Object.assign(this.data,obj);this.persist();}          // -> CloudSave via PlatformAdapter later
  loadGame(){this.load();return this.data;}
  saveHighScore(v){if(v>this.data.highScore){this.data.highScore=v;this.persist();return true;}return false;}
  getHighScore(){return this.data.highScore;}
  saveSettings(o){Object.assign(this.data,o);this.persist();}
  loadSettings(){return{muted:!!this.data.muted};}
  addCoins(n){this.data.totalCoins+=n;this.persist();}
}

/* ======================= scripts/audio/AudioManager.ts ======================= */
class AudioManager{
  constructor(){this.ctx=null;this.master=null;this.sfx=null;this.musicG=null;this.muted=false;this.noiseBuf=null;this._musicOn=false;this._step=0;this._next=0;this._timer=null;}
  init(){
    if(this.ctx)return;
    const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;
    this.ctx=new AC();
    this.master=this.ctx.createGain();this.master.gain.value=this.muted?0:1;this.master.connect(this.ctx.destination);
    this.sfx=this.ctx.createGain();this.sfx.gain.value=0.9;this.sfx.connect(this.master);
    this.musicG=this.ctx.createGain();this.musicG.gain.value=0.5;this.musicG.connect(this.master);
    const len=this.ctx.sampleRate*0.5,buf=this.ctx.createBuffer(1,len,this.ctx.sampleRate),d=buf.getChannelData(0);
    for(let i=0;i<len;i++)d[i]=Math.random()*2-1;
    this.noiseBuf=buf;
  }
  resume(){if(this.ctx&&this.ctx.state==='suspended')this.ctx.resume();}
  setMuted(m){this.muted=m;if(this.master)this.master.gain.value=m?0:1;}
  tone(o){
    if(!this.ctx)return;
    const t0=this.ctx.currentTime+(o.delay||0);
    const osc=this.ctx.createOscillator(),g=this.ctx.createGain();
    osc.type=o.type||'sine';
    osc.frequency.setValueAtTime(o.f0,t0);
    if(o.f1)osc.frequency.exponentialRampToValueAtTime(Math.max(1,o.f1),t0+o.dur);
    g.gain.setValueAtTime(0.0001,t0);
    g.gain.exponentialRampToValueAtTime(o.vol||0.1,t0+(o.attack||0.012));
    g.gain.exponentialRampToValueAtTime(0.0001,t0+o.dur);
    osc.connect(g);g.connect(o.bus||this.sfx);
    osc.start(t0);osc.stop(t0+o.dur+0.05);
  }
  noise(o){
    if(!this.ctx)return;
    const t0=this.ctx.currentTime+(o.delay||0);
    const src=this.ctx.createBufferSource();src.buffer=this.noiseBuf;src.loop=true;
    const f=this.ctx.createBiquadFilter();f.type='lowpass';f.frequency.value=o.freq||1000;
    const g=this.ctx.createGain();
    g.gain.setValueAtTime(0.0001,t0);
    g.gain.exponentialRampToValueAtTime(o.vol||0.1,t0+0.01);
    g.gain.exponentialRampToValueAtTime(0.0001,t0+o.dur);
    src.connect(f);f.connect(g);g.connect(o.bus||this.sfx);
    src.start(t0);src.stop(t0+o.dur+0.05);
  }
  click(){this.tone({f0:660,f1:520,dur:.07,type:'square',vol:.07});}
  jump(){this.tone({f0:300,f1:820,dur:.2,type:'square',vol:.1});this.tone({f0:600,f1:1640,dur:.18,type:'sine',vol:.05});}
  coin(){this.tone({f0:988,dur:.07,vol:.12});this.tone({f0:1319,dur:.14,vol:.12,delay:.07});}
  land(){this.noise({dur:.08,vol:.06,freq:600});}
  death(){this.tone({f0:420,f1:46,dur:.55,type:'sawtooth',vol:.16});this.noise({dur:.45,vol:.16,freq:900});}
  record(){[523,659,784,1047].forEach((f,i)=>this.tone({f0:f,dur:.14,type:'triangle',vol:.12,delay:i*.09}));}
  speedup(){this.tone({f0:500,f1:1200,dur:.15,type:'square',vol:.08});}
  startMusic(){
    if(!this.ctx||this._musicOn)return;
    this._musicOn=true;this._step=0;this._next=this.ctx.currentTime+0.06;
    this._timer=setInterval(()=>this._sched(),27);
  }
  stopMusic(){this._musicOn=false;if(this._timer){clearInterval(this._timer);this._timer=null;}}
  _sched(){
    if(!this._musicOn)return;
    const stepDur=60/132/2;
    while(this._next<this.ctx.currentTime+0.12){this._playStep(this._step,this._next);this._step=(this._step+1)%64;this._next+=stepDur;}
  }
  _playStep(s,t){
    const mf=m=>440*Math.pow(2,(m-69)/12),d=Math.max(0,t-this.ctx.currentTime);
    const roots=[48,45,41,43],root=roots[(s/16)|0],st=s%16;
    if(st%4===0)this.tone({f0:mf(root-12),dur:.22,type:'square',vol:.06,delay:d,bus:this.musicG});
    if(st%8===6)this.tone({f0:mf(root-5),dur:.16,type:'square',vol:.045,delay:d,bus:this.musicG});
    if(st%4===2)this.noise({dur:.04,vol:.02,freq:6000,delay:d,bus:this.musicG});
    const mel=[72,0,74,0,76,0,74,0,72,0,69,0,72,0,0,0,
               67,0,69,0,72,0,74,0,76,0,0,0,74,0,72,0,
               72,0,74,0,76,0,79,0,76,0,74,0,72,0,0,0,
               67,0,64,0,65,0,67,0,69,0,0,0,0,0,0,0];
    if(mel[s])this.tone({f0:mf(mel[s]),dur:.16,type:'triangle',vol:.07,delay:d,bus:this.musicG});
  }
}

/* ======================= scripts/core/EventBus.ts ======================= */
class EventBus{
  constructor(){this.m={};}
  on(ev,fn){(this.m[ev]=this.m[ev]||[]).push(fn);return()=>this.off(ev,fn);}
  off(ev,fn){const a=this.m[ev];if(!a)return;const i=a.indexOf(fn);if(i>=0)a.splice(i,1);}
  emit(ev,...args){const a=this.m[ev];if(a)for(const f of a.slice())f(...args);}
}

/* ======================= scripts/platform/InputManager.ts ======================= */
class InputManager{
  constructor(stage){
    this.jumpHeld=false;this.onJump=[];this.onRelease=[];this.onPause=[];this.onConfirm=[];
    stage.addEventListener('pointerdown',e=>{
      if(e.target&&e.target.closest&&e.target.closest('button'))return;
      e.preventDefault();this.press();
    },{passive:false});
    window.addEventListener('pointerup',()=>this.release(),{passive:true});
    window.addEventListener('pointercancel',()=>this.release(),{passive:true});
    window.addEventListener('contextmenu',e=>e.preventDefault());
    window.addEventListener('keydown',e=>{
      if(e.repeat)return;
      if(e.code==='Space'||e.code==='ArrowUp'||e.code==='KeyW'){e.preventDefault();this.press();}
      else if(e.code==='KeyP'||e.code==='Escape'){for(const f of this.onPause)f();}
      else if(e.code==='Enter'){for(const f of this.onConfirm)f();}
    });
    window.addEventListener('keyup',e=>{if(e.code==='Space'||e.code==='ArrowUp'||e.code==='KeyW')this.release();});
  }
  press(){if(this.jumpHeld)return;this.jumpHeld=true;for(const f of this.onJump)f();}
  release(){this.jumpHeld=false;for(const f of this.onRelease)f();}
  reset(){this.jumpHeld=false;}
}

/* ======================= scripts/platform/PlatformAdapter.ts ======================= */
class LocalPlatformAdapter{
  constructor(save){
    this.save=save;this.loggedIn=false;this.uid='local-player';this.name='YOU';
    this.board=[['SKY_ACE',8200],['LUNAR_PUP',6800],['NEBULA',5900],['COCO_DASH',5100],['TURBO_TINA',4300],['JET_SET',3500],['MIMI_POP',2600],['QUIK_JUMP',1800]]
      .map(([n,s])=>({name:n,score:s}));
  }
  async initialize(){return true;}
  async login(){this.loggedIn=true;return{uid:this.uid,name:this.name};}
  isLoggedIn(){return this.loggedIn;}
  async getPlayerInfo(){return{uid:this.uid,name:this.name,anonymousId:this.uid+'-anon'};}
  async loadData(){return{highScore:this.save.getHighScore(),totalCoins:this.save.data.totalCoins};}
  async saveData(d){if(d.highScore!=null)this.save.saveHighScore(d.highScore);if(d.totalCoins!=null)this.save.saveGame({totalCoins:d.totalCoins});return true;}
  async submitScore(score){
    const e=this.board.find(b=>b.name===this.name);
    if(e){if(score>e.score)e.score=score;}else this.board.push({name:this.name,score});
    this.board.sort((a,b)=>b.score-a.score);this.board=this.board.slice(0,10);
    this.save.saveHighScore(score);return this.board;
  }
  getLeaderboard(){return this.board.slice();}
  async share(text){
    if(navigator.share){try{await navigator.share({text});return'shared';}catch(e){if(e&&e.name==='AbortError')return'cancelled';}}
    try{await navigator.clipboard.writeText(text);return'copied';}catch(e){return'failed';}
  }
  /* --- MOCKS: bukan integrasi TikTok sungguhan (DEV_MODE) --- */
  async showInterstitialAd(){await new Promise(r=>setTimeout(r,1600));return true;}
  async showRewardedAd(){await new Promise(r=>setTimeout(r,2200));return true;}
}

/* ======================= scripts/gameplay/ScoreManager.ts ======================= */
class ScoreManager{
  constructor(){this.reset();}
  reset(){this.distance=0;this.coins=0;}
  addDistance(d){this.distance+=d;}
  addCoin(n=1){this.coins+=n;}
  get score(){return Math.floor(this.distance/15)+this.coins*10;}
}

/* ======================= scripts/gameplay/DifficultyManager.ts ======================= */
class DifficultyManager{
  constructor(){this.reset();}
  reset(){this.time=0;this.level=1;}
  update(dt){this.time+=dt;const l=1+Math.floor(this.time/15);if(l>this.level){this.level=l;return true;}return false;}
  get speed(){return Math.min(320+this.time*6.5,860);}          // increasing difficulty: scroll speed
  get gapMin(){return 300+this.speed*0.45;}
  get gapMax(){return 540+this.speed*0.6;}
  get birdChance(){return Math.min(0.06+this.time*0.004,0.28);}   // harder patterns appear over time
  get tallChance(){return Math.min(0.04+this.time*0.003,0.22);}
  get doubleChance(){return Math.min(0.10+this.time*0.005,0.30);}
}

/* ======================= scripts/player/PlayerController.ts ======================= */
class PlayerController{
  constructor(){this.reset();}
  reset(){
    this.x=120;this.w=50;this.h=50;this.y=GROUND;this.vy=0;
    this.grounded=true;this.coyote=0;this.buf=0;this.dead=false;
    this.sx=1;this.sy=1;this.dustT=0;
  }
  bufferJump(){if(!this.dead)this.buf=JUMP_BUF;}
  onRelease(){if(this.vy<-260)this.vy=-260;}            // variable jump height
  update(dt,input){
    if(this.dead)return null;
    this.buf-=dt;
    if(this.grounded)this.coyote=COYOTE;else this.coyote-=dt;
    if(this.buf>0&&(this.grounded||this.coyote>0)){
      this.vy=-JUMP_V;this.grounded=false;this.coyote=0;this.buf=0;
      this.sx=0.86;this.sy=1.18;
      return 'jump';
    }
    const gMul=(this.vy<0&&input.jumpHeld)?0.5:1;        // hold to float higher
    this.vy+=GRAV*gMul*dt;
    if(this.vy>MAX_FALL)this.vy=MAX_FALL;
    this.y+=this.vy*dt;
    if(this.y>=GROUND){
      const hardLand=!this.grounded&&this.vy>700;
      this.y=GROUND;this.vy=0;this.grounded=true;
      if(hardLand){this.sx=1.26;this.sy=0.76;return 'land';}
    }else this.grounded=false;
    const k=1-Math.pow(0.0005,dt);
    this.sx+=((this.grounded?1:0.93)-this.sx)*k;
    this.sy+=((this.grounded?1:1.08)-this.sy)*k;
    if(this.grounded){this.dustT-=dt;if(this.dustT<=0){this.dustT=0.14;return 'dust';}}
    return null;
  }
  hitbox(){const m=7;return{x:this.x+m,y:this.y-this.h+m,w:this.w-2*m,h:this.h-2*m};}
  draw(ctx){
    if(this.dead)return;
    const cx=this.x+this.w/2,hgt=GROUND-this.y,sh=clamp(1-hgt/420,0.25,1);
    ctx.save();
    ctx.globalAlpha=0.22*sh+0.05;ctx.fillStyle='#1c2a1a';
    ctx.beginPath();ctx.ellipse(cx,GROUND+10,26*sh,7*sh,0,0,TAU);ctx.fill();
    ctx.restore();
    ctx.save();
    ctx.translate(cx,this.y);ctx.scale(this.sx,this.sy);
    const w=this.w,h=this.h;
    ctx.fillStyle='#ff5a2a';                              // tuft
    ctx.beginPath();ctx.moveTo(-8,-h+4);ctx.quadraticCurveTo(0,-h-12,10,-h+2);ctx.quadraticCurveTo(0,-h+6,-8,-h+4);ctx.fill();
    const g=ctx.createLinearGradient(0,-h,0,0);            // body
    g.addColorStop(0,'#ff8a50');g.addColorStop(1,'#ff5a2a');
    ctx.fillStyle=g;rr(ctx,-w/2,-h,w,h,14);ctx.fill();
    ctx.fillStyle='rgba(255,222,200,.9)';                   // belly
    ctx.beginPath();ctx.ellipse(0,-h*0.28,w*0.3,h*0.22,0,0,TAU);ctx.fill();
    const ey=-h*0.62;                                       // eyes
    ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(4,ey,7,0,TAU);ctx.arc(17,ey,7,0,TAU);ctx.fill();
    ctx.fillStyle='#26223a';ctx.beginPath();ctx.arc(6,ey,3.4,0,TAU);ctx.arc(19,ey,3.4,0,TAU);ctx.fill();
    ctx.fillStyle='rgba(255,120,140,.5)';                   // cheeks
    ctx.beginPath();ctx.arc(-8,-h*0.4,4.5,0,TAU);ctx.arc(20,-h*0.4,4.5,0,TAU);ctx.fill();
    ctx.restore();
  }
}

/* ======================= scripts/gameplay/ObstacleManager.ts ======================= */
const OBST_DEFS={
  spike:{w:54,h:44},
  double:{w:104,h:48},
  tall:{w:58,h:86},
  birdLow:{w:58,h:36,fly:true,alt:4,extra:60},
  birdHigh:{w:58,h:36,fly:true,alt:150,extra:60},
};
class ObstacleManager{
  constructor(){this.pool=[];this.active=[];this.time=0;}
  spawn(type,x){
    let o=this.pool.find(o=>!o.active&&o.type===type);
    if(!o){
      if(this.active.length>=16)return null;               // cap active enemies (perf)
      o={type,active:false,x:0,bottom:0,w:0,h:0,phase:0,bob:0,def:OBST_DEFS[type]};
      this.pool.push(o);
    }
    o.active=true;o.x=x;o.bottom=GROUND-(o.def.alt||0);o.w=o.def.w;o.h=o.def.h;o.phase=rand(0,TAU);
    if(!this.active.includes(o))this.active.push(o);
    return o;
  }
  update(dt,speed){
    this.time+=dt;
    for(let i=this.active.length-1;i>=0;i--){
      const o=this.active[i];
      o.x-=(speed+(o.def.extra||0))*dt;
      if(o.def.fly)o.bob=Math.sin(this.time*7+o.phase)*9;
      if(o.x<-160){o.active=false;this.active.splice(i,1);}
    }
  }
  hitbox(o){
    if(o.def.fly)return{x:o.x+9,y:o.bottom+o.bob-o.h+9,w:o.w-18,h:o.h-16};
    return{x:o.x+7,y:o.bottom-o.h+7,w:o.w-14,h:o.h-7};
  }
  clear(){for(const o of this.active)o.active=false;this.active.length=0;}
  draw(ctx){for(const o of this.active){if(o.def.fly)this.drawBird(ctx,o);else this.drawSpike(ctx,o);}}
  drawSpike(ctx,o){
    const x=o.x,b=o.bottom,h=o.h,w=o.w;
    ctx.fillStyle='#332451';ctx.fillRect(x-2,b-8,w+4,8);
    const n=o.type==='double'?6:3,tw=w/n;
    for(let i=0;i<n;i++){
      const tx=x+i*tw;
      ctx.fillStyle='#4b3670';
      ctx.beginPath();ctx.moveTo(tx,b);ctx.lineTo(tx+tw/2,b-h);ctx.lineTo(tx+tw,b);ctx.closePath();ctx.fill();
      ctx.fillStyle='#6f55a3';
      ctx.beginPath();ctx.moveTo(tx+tw*0.28,b-h*0.42);ctx.lineTo(tx+tw/2,b-h);ctx.lineTo(tx+tw*0.72,b-h*0.42);ctx.closePath();ctx.fill();
    }
  }
  drawBird(ctx,o){
    const cx=o.x+o.w/2,cy=o.bottom+o.bob-o.h/2,flap=Math.sin(this.time*20+o.phase);
    ctx.save();ctx.translate(cx,cy);
    ctx.fillStyle='#d63f77';
    ctx.beginPath();ctx.moveTo(-2,0);ctx.quadraticCurveTo(-16,-18-flap*10,-26,-6-flap*14);ctx.quadraticCurveTo(-12,2,-2,4);ctx.closePath();ctx.fill();
    ctx.fillStyle='#ef5d8f';
    ctx.beginPath();ctx.ellipse(0,0,24,15,0,0,TAU);ctx.fill();
    ctx.fillStyle='#ffd0dd';
    ctx.beginPath();ctx.ellipse(2,6,14,7,0,0,TAU);ctx.fill();
    ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(14,-4,5,0,TAU);ctx.fill();
    ctx.fillStyle='#26223a';ctx.beginPath();ctx.arc(15.5,-4,2.4,0,TAU);ctx.fill();
    ctx.fillStyle='#ffb347';
    ctx.beginPath();ctx.moveTo(22,-2);ctx.lineTo(31,1);ctx.lineTo(22,5);ctx.closePath();ctx.fill();
    ctx.restore();
  }
}

/* ======================= scripts/gameplay/CoinManager.ts ======================= */
class CoinManager{
  constructor(){this.pool=[];this.active=[];this.time=0;}
  spawn(x,y){
    let c=this.pool.find(c=>!c.active);
    if(!c){if(this.active.length>=70)return;c={active:false,x:0,y:0,ph:0};this.pool.push(c);}
    c.active=true;c.x=x;c.y=y;c.ph=rand(0,TAU);
    if(!this.active.includes(c))this.active.push(c);
  }
  spawnPattern(kind,x,opt={}){
    if(kind==='line'){
      const n=5,y=opt.y||GROUND-70;
      for(let i=0;i<n;i++)this.spawn(x+i*36,y);
    }else if(kind==='arc'){
      const n=7,w=opt.width||170,peak=opt.peak||150;
      for(let i=0;i<n;i++){const t=i/(n-1);this.spawn(x+t*w,GROUND-46-Math.sin(t*Math.PI)*peak);}
    }else if(kind==='ring'){
      const cx=x+70,cy=opt.y||GROUND-150;
      for(let i=0;i<6;i++){const a=i/6*TAU;this.spawn(cx+Math.cos(a)*38,cy+Math.sin(a)*38);}
    }
  }
  update(dt,speed){
    this.time+=dt;
    for(let i=this.active.length-1;i>=0;i--){
      const c=this.active[i];c.x-=speed*dt;
      if(c.x<-40||!c.active){c.active=false;this.active.splice(i,1);}
    }
  }
  clear(){for(const c of this.active)c.active=false;this.active.length=0;}
  draw(ctx){
    for(const c of this.active){
      const sq=Math.abs(Math.cos(this.time*5+c.ph)),sx=0.25+0.75*sq;
      ctx.save();ctx.translate(c.x,c.y);ctx.scale(sx,1);
      ctx.fillStyle='#e8a800';ctx.beginPath();ctx.arc(0,0,14,0,TAU);ctx.fill();
      ctx.fillStyle='#ffd54a';ctx.beginPath();ctx.arc(0,0,11.5,0,TAU);ctx.fill();
      ctx.fillStyle='#ffe9a3';ctx.beginPath();ctx.arc(0,0,6,0,TAU);ctx.fill();
      ctx.restore();
    }
  }
}

/* ======================= scripts/gameplay/Particles.ts ======================= */
class Particles{
  constructor(){this.pool=[];this.active=[];}
  spawn(o){
    let p=this.pool.find(p=>!p.active);
    if(!p){if(this.active.length>=220)return;p={active:false};this.pool.push(p);}
    Object.assign(p,{active:true,x:0,y:0,vx:0,vy:0,life:.6,max:.6,size:4,color:'#fff',grav:1,shape:'rect',rot:0,vr:0},o);
    p.max=p.life;
    if(!this.active.includes(p))this.active.push(p);
  }
  burst(x,y,n,opt={}){
    for(let i=0;i<n;i++){
      const a=rand(0,TAU),sp=rand(opt.sp0||60,opt.sp1||240);
      this.spawn({x,y,vx:Math.cos(a)*sp+(opt.vx||0),vy:Math.sin(a)*sp+(opt.vy||0),
        life:rand(.35,.7),size:rand(2.5,6),
        color:Array.isArray(opt.colors)?opt.colors[randi(0,opt.colors.length-1)]:'#fff',
        grav:opt.grav!==undefined?opt.grav:1,shape:opt.shape||'rect',rot:rand(0,TAU),vr:rand(-8,8)});
    }
  }
  update(dt){
    for(let i=this.active.length-1;i>=0;i--){
      const p=this.active[i];p.life-=dt;
      if(p.life<=0){p.active=false;this.active.splice(i,1);continue;}
      p.vy+=2200*p.grav*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.rot+=p.vr*dt;
    }
  }
  clear(){for(const p of this.active)p.active=false;this.active.length=0;}
  draw(ctx){
    for(const p of this.active){
      ctx.save();ctx.globalAlpha=clamp(p.life/p.max,0,1);ctx.translate(p.x,p.y);ctx.rotate(p.rot);
      ctx.fillStyle=p.color;
      if(p.shape==='rect')ctx.fillRect(-p.size/2,-p.size/2,p.size,p.size);
      else{ctx.beginPath();ctx.arc(0,0,p.size/2,0,TAU);ctx.fill();}
      ctx.restore();
    }
  }
}

/* ======================= scripts/gameplay/Popups.ts ======================= */
class Popups{
  constructor(){this.items=[];}
  add(x,y,txt,color='#fff'){this.items.push({x,y,txt,color,life:.9,max:.9});}
  update(dt){for(let i=this.items.length-1;i>=0;i--){const p=this.items[i];p.life-=dt;p.y-=46*dt;if(p.life<=0)this.items.splice(i,1);}}
  clear(){this.items.length=0;}
  draw(ctx){
    for(const p of this.items){
      ctx.save();ctx.globalAlpha=clamp(p.life/p.max,0,1);
      ctx.font='800 20px Trebuchet MS, sans-serif';ctx.textAlign='center';
      ctx.lineWidth=4;ctx.strokeStyle='rgba(0,0,0,.35)';ctx.strokeText(p.txt,p.x,p.y);
      ctx.fillStyle=p.color;ctx.fillText(p.txt,p.x,p.y);
      ctx.restore();
    }
  }
}

/* ======================= scripts/ui/UI.ts (menu + HUD + game over) ======================= */
class UI{
  constructor(gm){
    this.gm=gm;
    const $=id=>document.getElementById(id);
    Object.assign(this,{
      hud:$('hud'),scoreVal:$('scoreVal'),coinVal:$('coinVal'),scorePill:$('scorePill'),coinPill:$('coinPill'),
      menu:$('menu'),pauseOv:$('pauseOv'),overOv:$('overOv'),
      menuBest:$('menuBest'),menuCoins:$('menuCoins'),
      finalScore:$('finalScore'),finalBest:$('finalBest'),finalCoins:$('finalCoins'),
      recordBadge:$('recordBadge'),hint:$('hint'),toast:$('toast'),
      leadersPanel:$('leadersPanel'),leadersList:$('leadersList'),
    });
    this._s=-1;this._c=-1;
    const click=(id,fn)=>$(id).addEventListener('click',()=>{
      gm.audio.init();gm.audio.resume();gm.audio.click();fn();
    });
    click('btnPlay',()=>gm.startGame());
    click('btnPause',()=>gm.setPause(true));
    click('btnResume',()=>gm.setPause(false));
    click('btnRestart',()=>gm.startGame());
    click('btnHomeP',()=>gm.startMenu());
    click('btnRetry',()=>gm.startGame());
    click('btnHomeO',()=>gm.startMenu());
    click('btnLeaders',()=>this.toggleLeaders());
    click('btnLeadersClose',()=>this.toggleLeaders(false));
    click('btnShare',()=>gm.share());
    click('btnAd',()=>gm.mockAd());
    click('btnSoundMenu',()=>gm.toggleMute());
    click('btnSoundPause',()=>gm.toggleMute());
    this.leadersPanel.addEventListener('click',e=>{if(e.target===this.leadersPanel)this.toggleLeaders(false);});
  }
  toggleLeaders(force){
    const open=force!==undefined?force:!this.leadersPanel.classList.contains('open');
    this.leadersPanel.classList.toggle('open',open);
    if(open)this.buildLeaders();
  }
  buildLeaders(){
    this.leadersList.innerHTML=this.gm.platform.getLeaderboard()
      .map((r,i)=>`<li class="${r.name==='YOU'?'me':''}"><span>${i+1}. ${r.name}</span><span>${r.score}</span></li>`).join('');
  }
  showOverlay(name){
    for(const o of[this.menu,this.pauseOv,this.overOv])o.classList.remove('visible');
    if(name)this[name].classList.add('visible');
  }
  setHud(on){this.hud.classList.toggle('hidden',!on);}
  setScore(v){if(v===this._s)return;this._s=v;this.scoreVal.textContent=v;}
  setCoins(v){if(v===this._c)return;this._c=v;this.coinVal.textContent=v;}
  pop(el){el.classList.remove('pop');void el.offsetWidth;el.classList.add('pop');}
  refreshMenu(){this.menuBest.textContent=this.gm.save.getHighScore();this.menuCoins.textContent=this.gm.save.data.totalCoins;}
  syncSoundUI(){
    const m=this.gm.save.data.muted;
    document.getElementById('btnSoundMenu').classList.toggle('muted',m);
    const pb=document.getElementById('btnSoundPause');if(pb)pb.textContent='SOUND: '+(m?'OFF':'ON');
  }
  toast(msg){
    this.toast.textContent=msg;this.toast.classList.add('show');
    clearTimeout(this._toastT);this._toastT=setTimeout(()=>this.toast.classList.remove('show'),2200);
  }
  showHint(ms){
    this.hint.classList.add('show');
    clearTimeout(this._hintT);this._hintT=setTimeout(()=>this.hint.classList.remove('show'),ms||2600);
  }
  hideHint(){this.hint.classList.remove('show');}
}

/* ======================= scripts/core/GameManager.ts ======================= */
class GameManager{
  constructor(){
    this.stage=document.getElementById('stage');
    this.canvas=document.getElementById('cv');
    this.ctx=this.canvas.getContext('2d');
    this.save=new SaveManager();
    this.audio=new AudioManager();
    this.audio.setMuted(!!this.save.data.muted);
    this.bus=new EventBus();
    this.player=new PlayerController();
    this.input=new InputManager(this.stage);
    this.platform=new LocalPlatformAdapter(this.save);   // DEV_MODE: always local/mock
    this.ui=new UI(this);
    this.score=new ScoreManager();
    this.diff=new DifficultyManager();
    this.obstacles=new ObstacleManager();
    this.coins=new CoinManager();
    this.particles=new Particles();
    this.popups=new Popups();
    this.state='menu';
    this.dist=0;this.speed=90;this.nextSpawn=820;this.menuScroll=0;
    this.shakeT=0;this.shakeMag=0;this.deathT=0;this.time=0;
    this.clouds=[];
    for(let i=0;i<7;i++)this.clouds.push({x:rand(0,W+300),y:rand(50,330),s:rand(.6,1.4)});
    this.input.onJump.push(()=>this.player.bufferJump());
    this.input.onRelease.push(()=>this.player.onRelease());
    this.input.onPause.push(()=>{if(this.state==='playing')this.setPause(true);else if(this.state==='paused')this.setPause(false);});
    this.input.onConfirm.push(()=>{if(this.state==='menu')this.startGame();else if(this.state==='gameover')this.startGame();else if(this.state==='paused')this.setPause(false);});
    window.addEventListener('resize',()=>this.resize());
    window.addEventListener('orientationchange',()=>setTimeout(()=>this.resize(),200));
    document.addEventListener('visibilitychange',()=>{if(document.hidden&&this.state==='playing')this.setPause(true);});
    window.addEventListener('blur',()=>{if(this.state==='playing')this.setPause(true);});
    const initAudio=()=>{this.audio.init();this.audio.resume();if(this.state==='menu'||this.state==='playing')this.audio.startMusic();};
    window.addEventListener('pointerdown',initAudio);
    window.addEventListener('keydown',initAudio);
    this.ui.syncSoundUI();
    this.ui.refreshMenu();
    this.resize();
    this.last=performance.now();
    requestAnimationFrame(()=>this.loop());
  }
  resize(){
    const dpr=Math.min(window.devicePixelRatio||1,2);
    const cw=this.stage.clientWidth,ch=this.stage.clientHeight;
    this.canvas.width=Math.round(cw*dpr);
    this.canvas.height=Math.round(ch*dpr);
    this.scale=this.canvas.width/W;
    this.stage.style.setProperty('--s',(cw/W).toFixed(4));
    const g=this.ctx.createLinearGradient(0,0,0,H);
    g.addColorStop(0,'#3f9df7');g.addColorStop(.55,'#8fd4ff');g.addColorStop(.8,'#d8f3ff');g.addColorStop(1,'#eafcff');
    this.skyGrad=g;
    const sg=this.ctx.createRadialGradient(W-110,150,10,W-110,150,110);
    sg.addColorStop(0,'rgba(255,244,176,.95)');sg.addColorStop(.4,'rgba(255,238,150,.5)');sg.addColorStop(1,'rgba(255,238,150,0)');
    this.sunGrad=sg;
  }
  loop(){
    const now=performance.now();
    let dt=(now-this.last)/1000;this.last=now;
    if(dt>0.05)dt=0.05;
    this.time+=dt;
    if(this.state!=='paused')this.update(dt);
    this.render();
    requestAnimationFrame(()=>this.loop());
  }
  setPause(on){
    if(on&&this.state==='playing'){this.state='paused';this.ui.showOverlay('pauseOv');this.audio.stopMusic();}
    else if(!on&&this.state==='paused'){this.state='playing';this.ui.showOverlay(null);this.audio.startMusic();this.input.reset();this.last=performance.now();}
  }
  toggleMute(){
    const m=!this.save.data.muted;
    this.save.saveSettings({muted:m});
    this.audio.setMuted(m);
    this.ui.syncSoundUI();
    this.ui.toast(m?'Sound OFF':'Sound ON');
  }
  startMenu(){
    this.state='menu';this.dist=0;this.speed=90;this.menuScroll=0;
    this.obstacles.clear();this.coins.clear();this.particles.clear();this.popups.clear();
    this.player.reset();
    this.ui.showOverlay('menu');this.ui.setHud(false);this.ui.hideHint();
    this.ui.refreshMenu();this.ui.syncSoundUI();
    this.audio.init();this.audio.resume();this.audio.startMusic();
  }
  startGame(){
    this.state='playing';this.dist=0;this.speed=320;
    this.score.reset();this.diff.reset();this.time=0;
    this.obstacles.clear();this.coins.clear();this.particles.clear();this.popups.clear();
    this.player.reset();this.nextSpawn=820;this.deathT=0;
    this.input.reset();
    this.ui.showOverlay(null);this.ui.setHud(true);
    this.ui.setScore(0);this.ui.setCoins(0);
    this.ui.showHint(2800);
    this.audio.init();this.audio.resume();this.audio.startMusic();
  }
  share(){
    const text=`I scored ${this.score.score} in SKY HOPPER! Best: ${this.save.getHighScore()} - can you beat me?`;
    this.platform.share(text).then(r=>{
      if(r==='copied')this.ui.toast('Score copied to clipboard!');
      else if(r==='failed')this.ui.toast('Sharing not supported here');
    });
  }
  async mockAd(){
    this.ui.toast('Loading rewarded ad... (mock)');
    const ok=await this.platform.showRewardedAd();
    if(ok){this.save.addCoins(5);this.ui.refreshMenu();this.ui.toast('Ad (mock) complete - +5 coins saved!');}
  }
  update(dt){
    if(this.state==='menu'){
      this.menuScroll+=90*dt;
      for(const c of this.clouds){c.x-=8*dt;if(c.x<-160){c.x=W+rand(40,320);c.y=rand(50,330);}}
      this.particles.update(dt);
      return;
    }
    if(this.state==='dying'){
      this.deathT+=dt;
      this.dist+=this.speed*dt*0.25;
      this.obstacles.update(dt,this.speed*0.25);
      this.coins.update(dt,this.speed*0.25);
      this.particles.update(dt);this.popups.update(dt);
      if(this.shakeT>0)this.shakeT-=dt;
      if(this.deathT>1.0)this.finishGameOver();
      return;
    }
    if(this.state==='gameover'){
      this.particles.update(dt);this.popups.update(dt);
      return;
    }
    if(this.state!=='playing')return;
    // difficulty
    if(this.diff.update(dt)){this.popups.add(W/2,300,'SPEED UP!','#ffe259');this.audio.speedup();}
    this.speed=this.diff.speed;
    // player
    const pl=this.player,act=pl.update(dt,this.input);
    if(act==='jump'){this.audio.jump();this.particles.burst(pl.x+pl.w/2,pl.y,5,{colors:['#e6f7ff','#cfeef7'],sp0:40,sp1:120,vy:60,grav:.4,shape:'circle'});}
    else if(act==='land'){this.audio.land();this.particles.burst(pl.x+pl.w/2,GROUND,6,{colors:['#e6d9c0','#d9c7a7'],sp0:50,sp1:150,vy:30,grav:.6,shape:'circle'});}
    else if(act==='dust'){this.particles.spawn({x:pl.x+6,y:GROUND+2,vx:rand(-90,-30)-this.speed*0.15,vy:rand(-40,-10),life:.4,size:rand(2,4),color:'rgba(220,200,170,.8)',grav:.3,shape:'circle'});}
    // world
    this.dist+=this.speed*dt;
    this.score.addDistance(this.speed*dt);
    this.obstacles.update(dt,this.speed);
    this.coins.update(dt,this.speed);
    this.particles.update(dt);this.popups.update(dt);
    for(const c of this.clouds){c.x-=(8+this.speed*0.02)*dt;if(c.x<-160){c.x=W+rand(40,320);c.y=rand(50,330);}}
    this.nextSpawn-=this.speed*dt;
    if(this.nextSpawn<=0)this.trySpawn();
    this.checkCollisions();
    this.ui.setScore(this.score.score);
    this.ui.setCoins(this.score.coins);
    if(this.shakeT>0)this.shakeT-=dt;
  }
  trySpawn(){
    const d=this.diff,px=W+90,r=Math.random();
    let type='spike';
    if(r<d.birdChance)type=Math.random()<0.55?'birdLow':'birdHigh';
    else if(r<d.birdChance+d.tallChance)type='tall';
    else if(r<d.birdChance+d.tallChance+d.doubleChance)type='double';
    const def=OBST_DEFS[type];
    this.obstacles.spawn(type,px);
    if(Math.random()<0.62){
      if(type==='spike')this.coins.spawnPattern('arc',px-40,{peak:150,width:def.w+110});
      else if(type==='double')this.coins.spawnPattern('arc',px-30,{peak:170,width:def.w+120});
      else if(type==='tall')this.coins.spawnPattern('arc',px-30,{peak:230,width:def.w+120});
      else if(type==='birdHigh')this.coins.spawnPattern('line',px-30,{y:GROUND-70});
      else this.coins.spawnPattern('arc',px-20,{peak:130,width:def.w+90});
    }
    this.nextSpawn=def.w+rand(d.gapMin,d.gapMax);
  }
  checkCollisions(){
    const pb=this.player.hitbox();
    for(const o of this.obstacles.active){
      const b=this.obstacles.hitbox(o);
      if(pb.x<b.x+b.w&&pb.x+pb.w>b.x&&pb.y<b.y+b.h&&pb.y+pb.h>b.y){this.kill();return;}
    }
    for(let i=this.coins.active.length-1;i>=0;i--){
      const c=this.coins.active[i];
      const nx=clamp(c.x,pb.x,pb.x+pb.w),ny=clamp(c.y,pb.y,pb.y+pb.h);
      const dx=c.x-nx,dy=c.y-ny;
      if(dx*dx+dy*dy<256){
        c.active=false;this.coins.active.splice(i,1);
        this.score.addCoin(1);
        this.audio.coin();
        this.popups.add(c.x,c.y-10,'+10','#ffe259');
        this.particles.burst(c.x,c.y,8,{colors:['#ffd54a','#fff3b0','#e8a800'],sp0:80,sp1:220,grav:.6,shape:'circle'});
        this.ui.pop(this.ui.coinPill);
      }
    }
  }
  kill(){
    if(this.player.dead)return;
    this.player.dead=true;
    this.state='dying';this.deathT=0;
    this.shakeT=0.45;this.shakeMag=12;
    this.audio.death();this.audio.stopMusic();
    const cx=this.player.x+this.player.w/2,cy=this.player.y-this.player.h/2;
    this.particles.burst(cx,cy,22,{colors:['#ff8a50','#ff5a2a','#ffd9c4','#26223a'],sp0:120,sp1:420,grav:1,shape:'rect'});
  }
  finishGameOver(){
    this.state='gameover';
    const s=this.score.score,c=this.score.coins;
    const isRec=this.save.saveHighScore(s);
    this.save.saveGame({totalCoins:this.save.data.totalCoins+c,runs:this.save.data.runs+1});
    this.platform.submitScore(s);
    this.ui.finalScore.textContent=s;
    this.ui.finalBest.textContent=this.save.getHighScore();
    this.ui.finalCoins.textContent=c;
    this.ui.recordBadge.classList.toggle('hidden',!isRec);
    this.ui.showOverlay('overOv');
    this.ui.setHud(false);
    if(isRec)this.audio.record();
    this.ui.refreshMenu();
  }
  render(){
    const ctx=this.ctx;
    ctx.setTransform(this.scale,0,0,this.scale,0,0);
    let ox=0,oy=0;
    if(this.shakeT>0){const m=this.shakeMag*clamp(this.shakeT/0.45,0,1);ox=rand(-m,m);oy=rand(-m,m);}
    ctx.save();ctx.translate(ox,oy);
    const cam=this.state==='menu'?this.menuScroll:this.dist;
    this.drawBackground(cam);
    this.coins.draw(ctx);
    this.obstacles.draw(ctx);
    this.player.draw(ctx);
    this.particles.draw(ctx);
    this.popups.draw(ctx);
    ctx.restore();
  }
  ridge(color,yBase,a1,a2,f1,f2,off){
    const ctx=this.ctx;
    ctx.fillStyle=color;ctx.beginPath();ctx.moveTo(-20,H);
    for(let x=-20;x<=W+20;x+=14){
      const wx=x+off;
      ctx.lineTo(x,yBase-Math.abs(Math.sin(wx*f1))*a1-Math.sin(wx*f2+1.7)*a2);
    }
    ctx.lineTo(W+20,H);ctx.closePath();ctx.fill();
  }
  drawBackground(cam){
    const ctx=this.ctx;
    ctx.fillStyle=this.skyGrad;ctx.fillRect(-20,-20,W+40,H+40);
    ctx.fillStyle=this.sunGrad;ctx.fillRect(W-220,40,220,220);
    ctx.fillStyle='#fff3b0';ctx.beginPath();ctx.arc(W-110,150,42,0,TAU);ctx.fill();
    ctx.fillStyle='rgba(255,255,255,.92)';
    for(const c of this.clouds){
      ctx.save();ctx.translate(c.x,c.y);ctx.scale(c.s,c.s);
      ctx.beginPath();ctx.arc(0,0,22,0,TAU);ctx.arc(22,6,17,0,TAU);ctx.arc(-22,7,16,0,TAU);ctx.arc(0,10,24,0,TAU);ctx.fill();
      ctx.restore();
    }
    this.ridge('#a9c6f2',GROUND-70,150,26,0.006,0.019,cam*.25);
    this.ridge('#82cf96',GROUND-6,86,20,0.009,0.026,cam*.5);
    ctx.fillStyle='#96613a';ctx.fillRect(-20,GROUND+22,W+40,H-GROUND);
    ctx.fillStyle='#57c84d';ctx.fillRect(-20,GROUND,W+40,26);
    ctx.fillStyle='#7ce577';ctx.fillRect(-20,GROUND,W+40,8);
    ctx.fillStyle='#4ab845';
    const seg=44,offx=-(cam%seg);
    for(let x=offx-seg;x<W+seg;x+=seg){ctx.beginPath();ctx.arc(x+seg/2,GROUND+24,8,0,Math.PI);ctx.fill();}
    ctx.strokeStyle='rgba(0,0,0,.08)';ctx.lineWidth=3;
    const ts=64,tx=-(cam%ts);
    ctx.beginPath();
    for(let x=tx-ts;x<W+ts;x+=ts){ctx.moveTo(x,GROUND+26);ctx.lineTo(x,H);}
    ctx.moveTo(0,GROUND+70);ctx.lineTo(W,GROUND+70);
    ctx.stroke();
  }
}

/* ===== boot: Boot.scene -> MainMenu.scene ===== */
window.addEventListener('load',()=>{window.__gm=new GameManager();});
})();
</script>
